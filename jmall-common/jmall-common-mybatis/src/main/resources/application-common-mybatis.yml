# jmall-common-mybatis 模块默认配置
mybatis-plus:
  # Mapper XML 文件路径
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类别名包
  type-aliases-package: com.jmall.**.entity
  # 驼峰命名映射（数据库下划线 -> Java驼峰）
  configuration:
    map-underscore-to-camel-case: true
    # 日志输出（开发环境可开启）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 缓存开关
    cache-enabled: false
  global-config:
    # 关闭 MyBatis-Plus banner
    banner: false
    db-config:
      # 主键策略：雪花算法
      id-type: assign_id
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
      # 表名前缀（如需可配置）
      table-prefix: ""
