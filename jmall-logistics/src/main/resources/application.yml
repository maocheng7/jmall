# ========== 物流服务 application 配置 ==========
server:
  port: 8113

spring:
  application:
    name: jmall-logistics
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:jmall_logistics}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

# 物流查询配置（默认模拟，可对接快递鸟/顺丰）
jm-logistics:
  provider: mock
  poll-url: ""
  ebusiness-id: ""
  app-key: ""

springdoc:
  info:
    title: J-Mall 物流服务 API
    description: 运单/快递查询/轨迹接口
    version: 1.0.0

logging:
  level:
    com.jmall: info